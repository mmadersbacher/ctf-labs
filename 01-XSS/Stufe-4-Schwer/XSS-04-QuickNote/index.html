<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickNote — Notiz-Vorschau</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:640px;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:28px 30px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:22px}.sub{margin:0 0 18px;color:#8b949e;font-size:14px}
.shield{display:inline-flex;align-items:center;gap:7px;background:#10233d;border:1px solid #1f6feb;color:#79c0ff;padding:6px 12px;border-radius:999px;font-size:12px;margin-bottom:20px}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:6px}.rowf{display:flex;gap:10px}
input[type=text]{flex:1;padding:11px 13px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;font-size:15px}
input[type=text]:focus{outline:none;border-color:#58a6ff}
button{padding:11px 18px;border-radius:8px;border:1px solid #238636;background:#238636;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#2ea043}
#output{margin-top:22px;padding:16px;min-height:24px;background:#0d1117;border:1px dashed #30363d;border-radius:8px;font-size:16px;word-break:break-word}
#flag-box{margin-top:18px;padding:16px;border-radius:8px;background:#10331a;border:1px solid #2ea043;color:#7ee787;font-family:ui-monospace,Consolas,monospace;font-size:16px}
.foot{margin-top:24px;font-size:12px;color:#6e7681;line-height:1.6}code{background:#21262d;padding:1px 6px;border-radius:4px;font-size:12px}
</style></head><body>
<div class="card">
<h1>📝 QuickNote</h1>
<p class="sub">Schreib eine kurze Notiz — wir zeigen dir sofort die Vorschau.</p>
<div class="shield">🛡️ XSS-Schutz aktiv — Sonderzeichen werden entfernt</div>
<label for="note-input">Notiz</label>
<div class="rowf"><input type="text" id="note-input" placeholder="deine Notiz ..." autocomplete="off"><button id="prev-btn">Vorschau</button></div>
<div id="output">Noch keine Notiz.</div>
<div id="flag-box" hidden></div>
<p class="foot">Der Filter wirft alle <code>&lt; &gt; " '</code> aus deiner Eingabe. Danach wird die Notiz für die Anzeige noch normalisiert. 100&nbsp;% sicher, versprochen.</p>
</div>
<script>
var _b="=03cwV3XzQGMjNDZf12Mk9lcwY3XmNTMs9lczQHbxY2eSJVUMVEV";
function _dec(s){return atob(s.split('').reverse().join(''))}
function showFlag(){var e=document.getElementById('flag-box');e.textContent="🚩 Flag: "+_dec(_b);e.hidden=false}
function render(raw){
  var filtered=raw.replace(/[<>"']/g,'');           // Schutz: gefaehrliche Zeichen raus
  var decoded; try{decoded=decodeURIComponent(filtered)}catch(e){decoded=filtered}  // dann fuer Anzeige normalisieren
  document.getElementById('output').innerHTML='Vorschau: <b>'+decoded+'</b>';
}
window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('prev-btn').addEventListener('click',function(){render(document.getElementById('note-input').value)});
  document.getElementById('note-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('prev-btn').click()});
});
</script></body></html>
